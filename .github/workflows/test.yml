name: Frontend and tracker tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check frontend syntax
        run: |
          node --check public/app.js
          node --check public/ranking-math.js
          node --check src/worker.js
      - name: Run all unit and UI regression tests
        run: node --test
